{% extends "base.html" %}
{% block title %}Log in | SolaRythm{% endblock %}
{% block content %}
<div class="card">
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% for field in form %}
      <p>
        {{ field.label_tag }}
        {{ field }}
        {% for error in field.errors %}<span class="errorlist">{{ error }}</span>{% endfor %}
      </p>
    {% endfor %}
    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
