{% extends "base.html" %}
{% block title %}Edit Profile | SolaRythm{% endblock %}
{% block content %}
<div class="card">
  <h2>Edit profile</h2>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save changes</button>
    <a class="btn btn-secondary" href="{% url 'profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
